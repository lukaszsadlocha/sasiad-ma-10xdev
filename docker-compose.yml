version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sasiad-ma-postgres-dev
    environment:
      POSTGRES_DB: sasiadma_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sasiad-ma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - FrontendUrl=http://localhost:5173
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=sasiadma_dev;Username=postgres;Password=postgres;Port=5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sasiad-ma-network

volumes:
  postgres_data:

networks:
  sasiad-ma-network:
    driver: bridge
